<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Scores · Data Science Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221.5%22%20y%3D%221.5%22%20width%3D%2229%22%20height%3D%2229%22%20rx%3D%225%22%20fill%3D%22%230d1b2a%22%20stroke%3D%22%23ffcb3d%22%20stroke-width%3D%222.5%22%2F%3E%3Cellipse%20cx%3D%2216%22%20cy%3D%2225%22%20rx%3D%229%22%20ry%3D%223.6%22%20fill%3D%22%231b2b3d%22%20stroke%3D%22%23ffcb3d%22%20stroke-width%3D%221.5%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2211%22%20width%3D%224%22%20height%3D%2213%22%20rx%3D%222%22%20fill%3D%22%23ffcb3d%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%229.5%22%20r%3D%225.2%22%20fill%3D%22%23e5484d%22%20stroke%3D%22%23fff1b8%22%20stroke-width%3D%221.3%22%2F%3E%3Ccircle%20cx%3D%2213.9%22%20cy%3D%228%22%20r%3D%221.5%22%20fill%3D%22%23ffd4d6%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root{
    --ink:#0d1b2a; --gold:#ffcb3d; --goldh:#fff1b8;
    --text:#e9eef5; --dim:#9fb2c9; --line:#2e466b;
    --panel:#121d30; --panel2:#18253b;
    --accent:#ffcb3d; --accentbg:#121d30;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:#08101c; color:var(--text);
    font-family:"Courier New",ui-monospace,monospace; font-weight:bold; letter-spacing:.5px;
    display:flex; align-items:flex-start; justify-content:center; padding:18px; image-rendering:pixelated;
  }
  .wrap{width:100%; max-width:640px}
  h1{text-transform:uppercase; line-height:1.1}
  .frame{border:4px solid var(--accent); background:var(--panel); box-shadow:0 0 0 4px #08101c, 6px 6px 0 0 #000; padding:20px}
  .top{display:flex; align-items:center; gap:16px; margin-bottom:4px}
  .top canvas{flex:0 0 auto; image-rendering:pixelated}
  .ttx{flex:1}
  .kicker{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim)}
  .ttx h1{color:var(--accent); font-size:26px; letter-spacing:2px; text-shadow:3px 3px 0 #000; margin-top:5px}
  .concept{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-top:7px; opacity:.85}
  .rule{height:0; border-top:3px dotted var(--line); margin:16px 0}
  ol.board{list-style:none; margin:0; padding:0}
  ol.board li{display:flex; align-items:center; gap:12px; font-size:15px; letter-spacing:0; padding:9px 6px; border-bottom:2px dotted var(--line)}
  ol.board li:last-child{border-bottom:0}
  ol.board .rk{width:30px; text-align:right; color:var(--dim); flex:0 0 auto}
  ol.board li:nth-child(1) .rk{color:var(--gold)}
  ol.board li:nth-child(2) .rk{color:#cdd6e0}
  ol.board li:nth-child(3) .rk{color:#d8964a}
  ol.board .nm{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text)}
  ol.board .sc{color:var(--goldh); flex:0 0 auto}
  ol.board .msg{color:var(--dim); font-size:12px; text-transform:none; letter-spacing:0; padding:14px 6px; border-bottom:0}
  .acts{display:flex; gap:12px; margin-top:18px}
  .acts a{flex:1; text-align:center; text-decoration:none; text-transform:uppercase; font-size:12px; letter-spacing:1px; padding:13px 10px; box-shadow:3px 3px 0 0 #000; transition:transform .04s}
  .acts a:hover{transform:translate(-2px,-2px)}
  .acts .play{background:var(--accent); color:var(--ink)}
  .acts .back{background:var(--panel2); color:var(--text); border:3px solid var(--line); box-shadow:none}
  @media (max-width:460px){ .acts{flex-direction:column} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <div class="top">
        <canvas class="sprite" id="spr" width="104" height="112"></canvas>
        <div class="ttx">
          <div class="kicker">★ High Scores</div>
          <h1 id="gtitle">High Scores</h1>
          <div class="concept" id="gconcept"></div>
        </div>
      </div>
      <div class="rule"></div>
      <ol class="board" id="board"><li class="msg">Loading scores…</li></ol>
      <div class="acts">
        <a class="play" id="playlink" href="index.html">▶ Play Game</a>
        <a class="back" href="index.html">← Back to Arcade</a>
      </div>
    </div>
  </div>

<script>
// Full leaderboard per game. Anon public key only (RLS-protected, same key the games embed).
const LB_URL = "https://lvcavhfmbzrjqsmvjebe.supabase.co";
const LB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2Y2F2aGZtYnpyanFzbXZqZWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NDEwOTAsImV4cCI6MjEwNzQxNzA5MH0.GfI7_wUqjMWX9un5mKpeRHPcdYplzLZ1mrgwUq5FKgc";

const GAMES = {
  "anglers":    {folder:"the-anglers-dilemma", table:"scores",            title:"The Angler's Dilemma", concept:"Precision vs. Recall",        accent:"#2f9bd6", ink:"#06121d", spr:"bluegill"},
  "weather":    {folder:"weather-forecaster",  table:"weather_scores",    title:"Weather Forecaster",   concept:"Overfitting · Bias–Variance", accent:"#3fb950", ink:"#0d1b2a", spr:"raincloud"},
  "fools-gold": {folder:"fools-gold",           table:"fools_gold_scores", title:"Fool's Gold",          concept:"Sample Size · Uncertainty",   accent:"#e08a3c", ink:"#1c140a", spr:"prospector"},
};

const key = new URLSearchParams(location.search).get("game");
const g = GAMES[key] || GAMES["anglers"];

document.documentElement.style.setProperty("--accent", g.accent);
document.documentElement.style.setProperty("--ink", g.ink);
document.title = g.title + " · High Scores · Data Science Arcade";
document.getElementById("gtitle").textContent = g.title;
document.getElementById("gconcept").textContent = g.concept;
const play = document.getElementById("playlink");
play.href = g.folder + "/index.html";
play.textContent = "▶ Play " + g.title;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadBoard(){
  const ol = document.getElementById("board");
  try{
    const r = await fetch(`${LB_URL}/rest/v1/${g.table}?select=name,score&order=score.desc&limit=25`,
      { headers:{ apikey:LB_KEY, Authorization:`Bearer ${LB_KEY}` } });
    const rows = await r.json();
    if(!Array.isArray(rows) || rows.length===0){ ol.innerHTML = '<li class="msg">No scores yet — be the first to post one ▸</li>'; return; }
    ol.innerHTML = rows.map((x,i) =>
      `<li><span class="rk">${i+1}</span><span class="nm">${esc(x.name)}</span><span class="sc">${Number(x.score)||0}</span></li>`
    ).join("");
  }catch(e){ ol.innerHTML = '<li class="msg">Scores unavailable right now.</li>'; }
}
loadBoard();

// Pixel sprites lifted from each game (grids + palettes verbatim).
const SPR = {
  bluegill:["........TTT.TTT.........",".......TTTTTTTTT........","......LLLLLLLLLLL.......",".....LLLLLLLLLLLLL......","...T.LLLLLLLLLLLLLEE....","..TTTLLLLLLLLLkkLLEE....",".TTTTBBBBBBBBBkkBBBEP...","TTTT.BBBBBBBBBBBBBBBm...","TTTT.BBBBBBBBBBBBBBBm...",".TTTTBBBBBBBBfBBBBBBm...","..TTTBBBBBBBBffBoooB....","...T.dddddddddfoooo.....",".....ddddddddddooo......","......ddddddddddo.......",".......ddddddddd........","......TTTTTTTTT.........",".......TTT.TTT.........."],
  raincloud:["..........ccc...........","........ccccccc.........",".......ccccccccc........",".....cccccccccccccc.....","....cccccccccccccccc....","...cccccccccccccccccc...","..cccccccccccccccccccc..","..gccccccccccccccccccg..","..ggcccccccccccccccggg..","....gggggggggggggggg....","....gggggggggggggggg....","........................","....b....b....b....b....","....b....b....b....b....","........................","..b....b....b....b....b.","..b....b....b....b....b.","........................","....b....b....b....b....","....b....b....b....b...."],
  prospector:["........HHHHHHHH........",".....HHHHHHHHHHHHHH.....","....HHHHHHHHHHHHHHHH....","...HHHHHHHHHHHHHHHHHH...","..hHHHHHHHHHHHHHHHHHHh..",".hhHHHHHHHHHHHHHHHHHHhh.","hhhhHHHHHHHHHHHHHHHHhhhh","...hhhhhhhhhhhhhhhhhh...","......ssssssssssss......","......ssssssssssss......","......sseesssseess......","......ssssssssssss......",".......sSSSSSSSSs.......","......bbbbsSSsbbbb......","......bbbbmmmmbbbb......",".....bbbbbbbbbbbbbb.....",".....bBbbbbbbbbbbBb.....","....bbbbbbbbbbbbbbbb....","....bbbBbbbbbbbbBbbb....",".....bbbbbbbbbbbbbb.....","......bbbbbbbbbbbb......",".......bbbbbbbbbb.......","........bbbbbbbb........","..rrrrrrrrrr.PPPPPPPP...","..rrrrrrrrrr.pggggggp...","..RRRRRRRRRR.pPPPPPPp..."],
};
const PAL = {
  bluegill:{L:"#9cc6e0",B:"#6aa6c8",d:"#5a90b2",T:"#3f6f8f",f:"#4f7fa0",o:"#e59a3d",k:"#24405c",E:"#ffffff",P:"#0d1b2a",m:"#2a4a63"},
  raincloud:{c:"#d8e2ee",g:"#8a97a8",b:"#5aa0d8"},
  prospector:{H:"#c08a3e",h:"#8a5f28",s:"#e8b98f",S:"#c9966a",e:"#2a2018",b:"#d7d1c2",B:"#a49c88",m:"#7a3b2a",r:"#b24a3a",R:"#8a3528",p:"#cfd5dd",P:"#8c929c",g:"#ffcf4d"},
};
function drawInto(cv, name){
  const grid=SPR[name], pal=PAL[name];
  if(!grid) return;
  const x=cv.getContext("2d"); x.imageSmoothingEnabled=false; x.clearRect(0,0,cv.width,cv.height);
  const gw=grid[0].length, gh=grid.length;
  const px=Math.max(2,Math.floor(Math.min((cv.width-8)/gw,(cv.height-8)/gh)));
  const ox=Math.floor((cv.width-gw*px)/2), oy=Math.floor((cv.height-gh*px)/2);
  for(let r=0;r<gh;r++){ const row=grid[r];
    for(let c=0;c<row.length;c++){ const ch=row[c]; if(ch==="."||ch===" ")continue;
      const col=pal[ch]; if(!col)continue; x.fillStyle=col; x.fillRect(ox+c*px,oy+r*px,px,px); } }
}
drawInto(document.getElementById("spr"), g.spr);
</script>
</body>
</html>
